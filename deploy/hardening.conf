[Service]
# Memory cap with auto-kill — prevents a single leaky process from wedging
# the entire 1.9 GB VM. systemd Restart=always will bring it back in 30s.
MemoryMax=550M
MemoryHigh=450M
OOMPolicy=stop
TasksMax=200

# Restart fast on death — but back off after rapid-cycle to give SSH a
# window to attach if something's seriously broken
Restart=always
RestartSec=20
StartLimitIntervalSec=600
StartLimitBurst=10

# Daily flush: systemd will restart the process every 24h via RuntimeMaxSec.
# Cleaner than a cron — no race with the bot writing state mid-restart.
RuntimeMaxSec=86400
